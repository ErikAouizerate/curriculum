# Dev-only additions, auto-merged by `docker compose up` (production is Vercel, never this file).
# Local HTTP routing goes through the shared caddy-docker-proxy on the external
# `local-proxy` network (see Basic Memory note « Local Development Challenges —
# Caddy Reverse Proxy & Docker Compose Dashboard »). Site: http://curriculum.localhost
services:
  web:
    build:
      target: dev
    volumes:
      - .:/app
      - /app/node_modules # keep the container's pnpm store links, don't shadow with host's
      - /app/.next # keep Next output off the host (avoids root-owned .next artifacts)
    environment:
      NODE_ENV: development
    command: pnpm dev
    networks:
      - default
      - proxy
    labels:
      caddy: http://curriculum.localhost
      caddy.reverse_proxy: "{{upstreams 3000}}"

networks:
  proxy:
    external: true
    name: local-proxy
