# Dev-only additions, auto-merged by `docker compose up` (production is Vercel, never this file).
# Local HTTP routing goes through the shared caddy-docker-proxy on the external `local-proxy`
# network: the dev site is served at http://curriculum.localhost
services:
  web:
    volumes:
      - .:/app
      - /app/node_modules # keep the container's pnpm store links, don't shadow with host's
      - /app/.svelte-kit # keep generated types and build output off the host
    environment:
      NODE_ENV: development
      VITE_DEV_HOST: 0.0.0.0
    command: pnpm dev
    networks:
      - default
      - proxy
    labels:
      caddy: http://curriculum.localhost
      caddy.reverse_proxy: "{{upstreams 3000}}"

networks:
  proxy:
    external: true
    name: local-proxy
