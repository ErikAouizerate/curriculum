# Supply-chain hardening — « pnpm Policy for JS-TS Projects » (Basic Memory, project "main")

# Block installing a package version published less than 7 days ago (10080 minutes).
minimumReleaseAge: 10080

# Fail the install instead of silently falling back to a too-recent version.
minimumReleaseAgeStrict: true

# Block transitive dependencies from fetching code from external git repos.
blockExoticSubdeps: true

# Disable lifecycle scripts unless the package is explicitly allow-listed
# (approve with `pnpm approve-builds`, or `allowBuilds:` below).
strictDepBuilds: true

verifyDepsBeforeRun: warn

# Allow-listed build scripts (deliberate approvals).
allowBuilds:
  sharp: true

# Force patched versions of vulnerable transitive dependencies, constrained to
# semver-compatible majors (see Trivy report: browserslist, nanoid, @babel/*, postcss).
overrides:
  browserslist: ">=4.28.7 <5"
  nanoid: ">=3.3.18 <4"
  "@babel/core": ">=7.29.6 <8"
  "@babel/helpers": ">=7.26.10 <8"
  postcss: ">=8.5.28 <9"
